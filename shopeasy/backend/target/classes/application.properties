server.port=8080

# ---- MySQL (change the password to yours, or set env var DB_PASSWORD) ----
spring.datasource.url=jdbc:mysql://localhost:3306/ecommerce_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- JWT (secret must be at least 32 characters; change it for production) ----
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-key-123456}
app.jwt.expiration-ms=86400000

# ---- CORS: React dev server ----
app.cors.allowed-origin=${FRONTEND_URL:http://localhost:5173}

# ---- Razorpay (leave empty = DEMO payment mode, no real gateway needed) ----
# Get free TEST keys from https://dashboard.razorpay.com -> Settings -> API Keys
razorpay.key-id=${RAZORPAY_KEY_ID:}
razorpay.key-secret=${RAZORPAY_KEY_SECRET:}
